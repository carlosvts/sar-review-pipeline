[project]
name = "sar-review-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carlosvts", email = "carlosvtsdev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# clustering (etapa 03) com o SPECTER2: o adapter só carrega com o adapters, que fixa transformers 4.57
cluster-specter = [
    "adapters>=1.3.0",
    "transformers~=4.57.6",
    "torch>=2.6",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "umap-learn>=0.5.7",
]
# clustering (etapa 03) com os modelos gerais (mpnet, qwen3) via sentence-transformers, transformers 5
cluster-sentence-transformers = [
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "accelerate>=1.15.0",
    "torch>=2.6",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "umap-learn>=0.5.7",
]
# RAG (Qwen3-Embedding) precisa de transformers 5; roda depois do clustering, nunca junto
rag = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
]

[project.scripts]
step01-snowball = "sar_review_pipeline.main:main"
step01-fetch = "sar_review_pipeline.fetch_metadata.__main__:main"
step02-screen-titles = "sar_review_pipeline.screening.screening:main"
step03-abstracts = "sar_review_pipeline.abstracts.__main__:main"
step04-fulltext = "sar_review_pipeline.fulltext.__main__:main"
step05-chunk = "sar_review_pipeline.rag.chunking:main"
step05-embed = "sar_review_pipeline.rag.embedds:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# cluster-specter fixa transformers 4.57 (adapters); os outros dois usam transformers 5 e não conflitam entre si
conflicts = [
    [{ extra = "cluster-specter" }, { extra = "cluster-sentence-transformers" }],
    [{ extra = "cluster-specter" }, { extra = "rag" }],
]
