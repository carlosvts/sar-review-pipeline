[project]
name = "sar-review-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carlosvts", email = "carlosvtsdev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
]

[project.scripts]
sar-review-pipeline = "sar_review_pipeline:main"
step01-fetch = "sar_review_pipeline.fetch_metadata.__main__:main"
step02-screen-titles = "sar_review_pipeline.screening:main"
step04-fulltext = "sar_review_pipeline.fulltext.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
